<h2 class="new-order-header">Customer {{customerName}} - New Order</h2>

<mat-dialog-content [formGroup]="form" class="new-order-form">
  <div class="row">
    <mat-form-field appearance="outline" class="half">
      <mat-label>Employee*</mat-label>
      <mat-select formControlName="empId"><mat-option *ngFor="let e of employees" [value]="e.empId">{{e.fullName}}</mat-option></mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="half">
      <mat-label>Shipper*</mat-label>
      <mat-select formControlName="shipperId"><mat-option *ngFor="let s of shippers" [value]="s.shipperId">{{s.companyName}}</mat-option></mat-select>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full"><mat-label>Ship Name*</mat-label><input matInput formControlName="shipName"></mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="third"><mat-label>Ship Address*</mat-label><input matInput formControlName="shipAddress"></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Ship City*</mat-label><input matInput formControlName="shipCity"></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Ship Country*</mat-label><input matInput formControlName="shipCountry"></mat-form-field>
  </div>

  <div class="row">
    <mat-form-field appearance="outline" class="third"><mat-label>Order Date*</mat-label><input matInput [matDatepicker]="od" formControlName="orderDate"><mat-datepicker-toggle matSuffix [for]="od"></mat-datepicker-toggle><mat-datepicker #od></mat-datepicker></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Required Date*</mat-label><input matInput [matDatepicker]="rd" formControlName="requiredDate"><mat-datepicker-toggle matSuffix [for]="rd"></mat-datepicker-toggle><mat-datepicker #rd></mat-datepicker></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Shipped Date</mat-label><input matInput [matDatepicker]="sd" formControlName="shippedDate"><mat-datepicker-toggle matSuffix [for]="sd"></mat-datepicker-toggle><mat-datepicker #sd></mat-datepicker></mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full"><mat-label>$ Freight*</mat-label><input matInput type="number" formControlName="freight"></mat-form-field>

  <h3>Order Details</h3>

  <mat-form-field appearance="outline" class="full"><mat-label>Product*</mat-label><mat-select formControlName="productId"><mat-option *ngFor="let p of products" [value]="p.productId">{{p.productName}}</mat-option></mat-select></mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="third"><mat-label>$ Unit Price*</mat-label><input matInput type="number" formControlName="unitPrice"></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Quantity*</mat-label><input matInput type="number" formControlName="qty"></mat-form-field>
    <mat-form-field appearance="outline" class="third"><mat-label>Discount*</mat-label><input matInput type="number" formControlName="discount"></mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">CLOSE</button>
  <button mat-button color="primary" (click)="save()">SAVE</button>
</mat-dialog-actions>
