<div class="container">
  <h2 class="title">Customers</h2>

  <mat-form-field appearance="outline" class="search">
    <mat-label>Customer Name</mat-label>
    <input matInput [formControl]="search" placeholder="Buscar cliente">
    <button matSuffix mat-icon-button *ngIf="search.value" (click)="search.setValue('')">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="full-width mat-elevation-z1">

    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</th>
      <td mat-cell *matCellDef="let row">{{row.customerName}}</td>
    </ng-container>

    <ng-container matColumnDef="lastOrderDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Order Date</th>
      <td mat-cell *matCellDef="let row">{{row.lastOrderDate | date:'shortDate'}}</td>
    </ng-container>

    <ng-container matColumnDef="nextPredictedOrder">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Next Predicted Order</th>
      <td mat-cell *matCellDef="let row">{{row.nextPredictedOrder | date:'shortDate'}}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-button color="warn" (click)="viewOrders(row.customerName)">VIEW ORDERS</button>
        <button mat-button color="primary" (click)="newOrder(row)">NEW ORDER</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="total"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[5,10,20]"
                 (page)="onPage($event)">
  </mat-paginator>
</div>
